name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Nothing here writes to the repository; the release workflow asks for more on its own.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Without this the test host hangs for minutes after the run, flushing telemetry.
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # dotnet test forwards unknown flags to the test app, so pass MSBuild-level options only.
      - name: Test
        run: dotnet test --no-build --configuration Release

  # Self-contained single-file binaries and the NuGet tool packages, for tags or when run by hand.
  # Every runtime identifier is cross-compiled on Linux, ReadyToRun included.
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish binaries
        run: |
          for rid in win-x64 linux-x64 linux-arm64; do
            dotnet publish src/TeamSpeak.Mcp/TeamSpeak.Mcp.csproj --configuration Release --runtime "$rid" --output "publish/$rid"
          done

      - name: Pack
        run: dotnet pack src/TeamSpeak.Mcp/TeamSpeak.Mcp.csproj --configuration Release --output publish/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: teamspeak6-mcp
          path: publish/
