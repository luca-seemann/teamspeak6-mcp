# Keeps the workflow actions and the NuGet packages current, one grouped pull request a month each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
